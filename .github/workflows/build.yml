name: Build Windows app
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --onefile --windowed --name FormBuilder --collect-all pymupdf app.py
      - uses: actions/upload-artifact@v4
        with:
          name: FormBuilder-windows
          path: dist/FormBuilder.exe
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/FormBuilder.exe
